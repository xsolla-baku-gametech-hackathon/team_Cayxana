<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Split view — player vs. server truth</title>
  <link rel="icon" href="data:,">
  <style>
    html, body { margin: 0; height: 100%; background: #0e1116; color: #c9d1d9; font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace; }
    .grid { display: grid; grid-template-columns: 1fr 1.3fr; gap: 10px; height: 100%; padding: 10px; box-sizing: border-box; }
    section { display: flex; flex-direction: column; min-height: 0; }
    header { padding: 0 2px 6px; display: flex; justify-content: space-between; gap: 12px; }
    header b { color: #fff; font-weight: normal; }
    header span { color: #8b949e; }
    iframe { flex: 1; width: 100%; border: 1px solid #30363d; background: #0e1116; }
    .player iframe:focus-within, .player iframe:focus { outline: 2px solid #4ea8f2; }
    .modes { display: flex; gap: 6px; }
    .modes button { font: inherit; background: #161b22; color: #c9d1d9; border: 1px solid #30363d; padding: 2px 8px; cursor: pointer; }
    .modes button[aria-pressed="true"] { border-color: #4ea8f2; color: #fff; }
  </style>
</head>
<body>
  <div class="grid">
    <section class="player">
      <header>
        <b>Player view</b>
        <span class="modes">
          <button data-mode="">manual</button>
          <button data-mode="bot">autoplay: bot</button>
          <button data-mode="human">autoplay: human-like</button>
        </span>
      </header>
      <iframe id="player" title="Player view"></iframe>
    </section>
    <section>
      <header><b>Admin view</b><span>server truth · traps shown as dashed rings</span></header>
      <iframe id="admin" title="Admin view"></iframe>
    </section>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    const key = params.get('key') ?? '';
    const admin = document.getElementById('admin');
    const player = document.getElementById('player');
    admin.src = '/admin/?key=' + encodeURIComponent(key);
    player.addEventListener('load', () => player.contentWindow.focus()); // keys go to the game by default

    // Mode buttons: reload the left view as manual / bot autopilot / human-like autopilot.
    function setMode(mode) {
      player.src = mode ? '/?auto=' + mode : '/';
      for (const b of document.querySelectorAll('.modes button')) b.setAttribute('aria-pressed', String(b.dataset.mode === mode));
      params.set('auto', mode);
      if (!mode) params.delete('auto');
      history.replaceState(null, '', '?' + params); // shareable link, survives refresh
    }
    for (const b of document.querySelectorAll('.modes button')) b.onclick = () => setMode(b.dataset.mode);
    setMode(['bot', 'human'].includes(params.get('auto')) ? params.get('auto') : '');

    // Relay "which player is on the left" to the admin view so it can highlight it.
    addEventListener('message', (e) => {
      if (e.origin !== location.origin || e.source !== player.contentWindow || e.data?.type !== 'watch') return;
      admin.contentWindow.postMessage(e.data, location.origin);
    });
  </script>
</body>
</html>
